[project]
name = "quantbt"
version = "0.1.0"
description = "Backtester desktop de estratégias quantitativas (Linux/macOS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]

[project.scripts]
quantbt = "quantbt.app:main"
quantbt-cli = "quantbt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
